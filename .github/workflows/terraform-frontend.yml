name: Terraform frontend checks

on:
  pull_request:
    paths:
      - "terraform/modules/frontend/**"
      - ".github/workflows/terraform-frontend.yml"
      - ".tflint.hcl"
      - ".tflint-version"
      - "terraform/environments/production/.terraform-version"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "terraform/modules/frontend/**"
      - ".github/workflows/terraform-frontend.yml"
      - ".tflint.hcl"
      - ".tflint-version"
      - "terraform/environments/production/.terraform-version"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read Terraform version
        id: terraform-version
        run: echo "version=$(cat terraform/environments/production/.terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version_file: .tflint-version
          cache: true
          plugin_dir: .tflint.d/plugins

      - name: Check frontend module
        run: make check
        env:
          GITHUB_TOKEN: ${{ github.token }}
